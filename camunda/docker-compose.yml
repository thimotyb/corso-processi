# Camunda 8.9 Self-Managed — configurazione minima per il laboratorio del corso.
#
# Derivata dalla distribuzione ufficiale camunda/camunda-distributions
# (release docker-compose-8.9, file docker-compose.yaml "lightweight"):
# solo Orchestration Cluster (Zeebe + Operate + Tasklist + API REST + MCP)
# e Connectors, con storage secondario H2 su file. Niente Elasticsearch,
# Keycloak, Web Modeler, Optimize, Console.
#
# NON per la produzione. Per la produzione: Helm/Kubernetes.
name: camunda-8-corso

services:
  # Allinea i permessi del volume dati prima dell'avvio del cluster.
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  # Orchestration Cluster consolidato: Zeebe + Operate + Tasklist + API REST + MCP.
  orchestration:
    image: camunda/camunda:${CAMUNDA_VERSION}
    container_name: corso-camunda
    ports:
      - "8080:8080"     # API REST del cluster, Operate, Tasklist, MCP (/mcp/cluster)
      - "26500:26500"   # Zeebe gRPC — bersaglio di deploy_process dal Modeler
      - "9600:9600"     # actuator / health
    env_file:
      - path: .env
        required: true
    mem_limit: 2g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 2s
      retries: 45
      start_period: 40s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    networks:
      - camunda
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  # Connectors — logica dei connettori in ingresso e uscita.
  connectors:
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION}
    container_name: corso-camunda-connectors
    ports:
      - "8086:8080"
    env_file:
      - connector-secrets.txt
      - path: .env
        required: true
    mem_limit: 512m
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 30s
    configs:
      - source: connectors-config
        target: application.yaml
    networks:
      - camunda
    depends_on:
      orchestration:
        condition: service_healthy

volumes:
  camunda:
  camunda-data:

networks:
  camunda:
    name: camunda-corso

configs:
  connectors-config:
    content: |
      camunda:
        client:
          mode: self-managed
          grpc-address: http://orchestration:26500
          rest-address: http://orchestration:8080
      management:
        endpoints:
          web:
            exposure:
              include: health,configprops
        endpoint:
          health:
            probes:
              enabled: true

  orchestration-config:
    file: ./configuration/application-h2.yaml
