<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">SIPOC del processo di customer service APQC 6.2.2</title>
  <desc id="desc">Diagramma a cinque colonne con Supplier, Input, Process, Output e Customer per la gestione di problemi, richieste e quesiti dei clienti.</desc>
  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#13253f">SIPOC — 6.2.2 Manage customer service problems, requests, and inquiries</text>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#425a73">Esempio didattico costruito sulla scheda APQC Category 6.0</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#13253f">
    <rect x="30" y="105" width="268" height="535" rx="8" fill="#eaf6fb" stroke="#0f6f8e" stroke-width="2"/>
    <rect x="298" y="105" width="268" height="535" rx="8" fill="#f4f8fc" stroke="#0f6f8e" stroke-width="2"/>
    <rect x="566" y="105" width="268" height="535" rx="8" fill="#eafaf1" stroke="#348b55" stroke-width="2"/>
    <rect x="834" y="105" width="268" height="535" rx="8" fill="#fff8e8" stroke="#c78b18" stroke-width="2"/>
    <rect x="1102" y="105" width="268" height="535" rx="8" fill="#fff0f0" stroke="#b84a4a" stroke-width="2"/>
    <text x="164" y="150" text-anchor="middle" font-size="24" font-weight="700">SUPPLIER</text>
    <text x="432" y="150" text-anchor="middle" font-size="24" font-weight="700">INPUT</text>
    <text x="700" y="150" text-anchor="middle" font-size="24" font-weight="700">PROCESS</text>
    <text x="968" y="150" text-anchor="middle" font-size="24" font-weight="700">OUTPUT</text>
    <text x="1236" y="150" text-anchor="middle" font-size="24" font-weight="700">CUSTOMER</text>
    <g font-size="18">
      <text x="55" y="205"><tspan x="55" dy="0">• Cliente</tspan><tspan x="55" dy="38">• Canali di contatto:</tspan><tspan x="75" dy="30">telefono, email, chat,</tspan><tspan x="75" dy="30">portale</tspan></text>
      <text x="323" y="205"><tspan x="323" dy="0">• Richiesta, problema</tspan><tspan x="323" dy="30">o quesito</tspan><tspan x="323" dy="38">• Storico cliente</tspan><tspan x="323" dy="38">• SLA contrattuali</tspan></text>
      <text x="591" y="205"><tspan x="591" dy="0">1. Ricevere la richiesta</tspan><tspan x="591" dy="38">2. Analizzarla</tspan><tspan x="591" dy="38">3. Risolverla oppure</tspan><tspan x="611" dy="30">identificare upsell/</tspan><tspan x="611" dy="30">cross-sell</tspan><tspan x="591" dy="38">4. Rispondere al cliente</tspan><tspan x="591" dy="38">5. Trasmettere il lead</tspan><tspan x="611" dy="30">alle vendite</tspan></text>
      <text x="859" y="205"><tspan x="859" dy="0">• Richiesta risolta</tspan><tspan x="859" dy="38">• Risposta al cliente</tspan><tspan x="859" dy="38">• Eventuale lead</tspan><tspan x="879" dy="30">commerciale</tspan></text>
      <text x="1127" y="205"><tspan x="1127" dy="0">• Cliente finale</tspan><tspan x="1127" dy="38">• Team Vendite</tspan><tspan x="1127" dy="30">  (opportunità</tspan><tspan x="1147" dy="30">identificate)</tspan></text>
    </g>
  </g>
  <text x="700" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#425a73">Fonte dei contenuti: esempi-apqc/05-customer-service/processo.md — rappresentazione originale del corso.</text>
</svg>
