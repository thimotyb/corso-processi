<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Schema di processo aziendale secondo la prospettiva Eriksson-Penker</title>
  <desc id="desc">Input a sinistra, processo con tre attività al centro, output a destra, obiettivo sopra e ruoli, regole e indicatori sotto.</desc>
  <defs>
    <linearGradient id="process" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e5f4fb"/>
      <stop offset="1" stop-color="#b8ddeb"/>
    </linearGradient>
    <linearGradient id="activity" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff2cc"/>
      <stop offset="1" stop-color="#f2d98b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#416579"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #17324d; }
      .small { font-family: Arial, sans-serif; font-size: 18px; fill: #17324d; }
      .tiny { font-family: Arial, sans-serif; font-size: 16px; fill: #39576b; }
      .box { stroke: #416579; stroke-width: 2; rx: 12; }
      .arrow { stroke: #416579; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #7993a3; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="label">Processo aziendale: trasformare input in output</text>

  <rect x="425" y="70" width="350" height="68" class="box" fill="#eaf4e4"/>
  <text x="600" y="99" text-anchor="middle" class="label">OBIETTIVO</text>
  <text x="600" y="124" text-anchor="middle" class="small">risultato atteso per il cliente</text>
  <path d="M600 138 V188" class="dashed"/>

  <rect x="42" y="210" width="210" height="190" class="box" fill="#f7e7ef"/>
  <text x="147" y="246" text-anchor="middle" class="label">INPUT</text>
  <text x="68" y="286" class="small">• richiesta / ordine</text>
  <text x="68" y="318" class="small">• dati e documenti</text>
  <text x="68" y="350" class="small">• materiali</text>
  <text x="68" y="382" class="small">• autorizzazioni</text>

  <rect x="300" y="178" width="600" height="255" class="box" fill="#e5f4fb" stroke-width="3"/>
  <text x="600" y="214" text-anchor="middle" class="label">PROCESSO</text>
  <text x="600" y="240" text-anchor="middle" class="tiny">insieme coordinato di attività e decisioni</text>

  <rect x="330" y="285" width="160" height="78" class="box" fill="#fff2cc"/>
  <text x="410" y="318" text-anchor="middle" class="small">Attività 1</text>
  <text x="410" y="344" text-anchor="middle" class="tiny">ricevere e verificare</text>
  <rect x="520" y="285" width="160" height="78" class="box" fill="#fff2cc"/>
  <text x="600" y="318" text-anchor="middle" class="small">Attività 2</text>
  <text x="600" y="344" text-anchor="middle" class="tiny">elaborare e decidere</text>
  <rect x="710" y="285" width="160" height="78" class="box" fill="#fff2cc"/>
  <text x="790" y="318" text-anchor="middle" class="small">Attività 3</text>
  <text x="790" y="344" text-anchor="middle" class="tiny">produrre e consegnare</text>
  <path d="M252 305 H325" class="arrow"/>
  <path d="M490 324 H515" class="arrow"/>
  <path d="M680 324 H705" class="arrow"/>
  <path d="M875 305 H948" class="arrow"/>

  <rect x="948" y="210" width="210" height="190" class="box" fill="#e8e1f4"/>
  <text x="1053" y="246" text-anchor="middle" class="label">OUTPUT</text>
  <text x="974" y="286" class="small">• prodotto / servizio</text>
  <text x="974" y="318" class="small">• decisione</text>
  <text x="974" y="350" class="small">• documento / dato</text>
  <text x="974" y="382" class="small">• risultato per il cliente</text>

  <rect x="250" y="500" width="700" height="92" class="box" fill="#f1f5f7"/>
  <text x="600" y="532" text-anchor="middle" class="label">CONTESTO E CONTROLLO</text>
  <text x="600" y="562" text-anchor="middle" class="small">ruoli · regole · risorse · rischi · indicatori · feedback</text>
  <path d="M600 500 V438" class="dashed"/>

  <text x="600" y="642" text-anchor="middle" class="tiny">Schema didattico originale, ispirato alla prospettiva di processo Eriksson-Penker.</text>
</svg>
