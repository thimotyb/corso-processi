<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="360" viewBox="0 0 1350 360" role="img" aria-labelledby="title desc">
  <title id="title">Schema didattico del processo SAP Procure to Pay</title>
  <desc id="desc">Una richiesta di acquisto viene trasformata in ordine al fornitore, ricezione, verifica della fattura e pagamento.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315d78"/>
    </marker>
    <style>
      .box { fill:#eaf3f7; stroke:#315d78; stroke-width:2; rx:14; }
      .output { fill:#eef5e8; stroke:#557342; stroke-width:2; rx:14; }
      .text { fill:#20303a; font: 600 21px Arial, sans-serif; text-anchor:middle; }
      .small { fill:#52636d; font: 18px Arial, sans-serif; text-anchor:middle; }
      .line { stroke:#315d78; stroke-width:3; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1350" height="360" fill="#ffffff"/>
  <text x="675" y="42" class="small">Schema didattico ricostruito dalla documentazione ufficiale SAP</text>
  <rect x="35" y="125" width="190" height="100" class="box"/>
  <text x="130" y="168" class="text"><tspan x="130" dy="0">Richiesta</tspan><tspan x="130" dy="30">di acquisto</tspan></text>
  <rect x="275" y="125" width="205" height="100" class="box"/>
  <text x="377" y="168" class="text"><tspan x="377" dy="0">Fonte di</tspan><tspan x="377" dy="30">approvvigionamento</tspan></text>
  <rect x="530" y="125" width="190" height="100" class="box"/>
  <text x="625" y="168" class="text"><tspan x="625" dy="0">Ordine al</tspan><tspan x="625" dy="30">fornitore</tspan></text>
  <rect x="770" y="125" width="190" height="100" class="box"/>
  <text x="865" y="168" class="text"><tspan x="865" dy="0">Ricezione</tspan><tspan x="865" dy="30">beni/servizi</tspan></text>
  <rect x="1010" y="125" width="145" height="100" class="box"/>
  <text x="1082" y="168" class="text"><tspan x="1082" dy="0">Verifica</tspan><tspan x="1082" dy="30">fattura</tspan></text>
  <rect x="1205" y="125" width="110" height="100" class="output"/>
  <text x="1260" y="168" class="text"><tspan x="1260" dy="0">Pagamento</tspan></text>
  <line x1="225" y1="175" x2="270" y2="175" class="line"/>
  <line x1="480" y1="175" x2="525" y2="175" class="line"/>
  <line x1="720" y1="175" x2="765" y2="175" class="line"/>
  <line x1="960" y1="175" x2="1005" y2="175" class="line"/>
  <line x1="1155" y1="175" x2="1200" y2="175" class="line"/>
  <text x="675" y="285" class="small">Procure to Pay: dalla domanda interna alla chiusura finanziaria</text>
</svg>
